<title>Waymore Jobs</title>
<style>
:root{--drbg:#1b1b1b;--drfg:#f2f2f2;--drmu:#a9a9a9;--drhi:#3a3a3a;--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mu:#66707f;--ac:#f5b700;--act:#8a5b00;--on-ac:#1a1a1a;--ln:#dde1e7;--ok:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--ac);color:var(--on-ac);padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#lng{font:inherit;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer}
#gear{font-size:17px;line-height:1;padding:3px 8px;border-radius:99px;border:2px solid currentColor;background:transparent;cursor:pointer}
#net{font-size:12px;font-weight:600;background:rgba(0,0,0,.14);padding:3px 8px;border-radius:99px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#net.me{background:rgba(0,0,0,.22);font-weight:700}#net.me.off{background:#e03131;color:#fff}
nav{display:none!important}
.note{border-top:1px solid var(--ln);padding:8px 0;font-size:15px}.note:first-of-type{border-top:0}

.lpin.off{background:#ccc}

.pvi img{width:100%;height:100%;object-fit:contain;touch-action:pinch-zoom}

.pvn.l{left:8px}.pvn.r{right:8px}
.pvb{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

#shopnm.logobox{background:#fff;border-radius:8px;padding:3px 9px;display:flex;align-items:center;min-width:0;overflow:hidden}#shopnm.logobox img{height:26px;width:auto;max-width:46vw;object-fit:contain;display:block}
#menu{font:inherit;font-size:22px;line-height:1;padding:2px 10px 4px;border-radius:10px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer}

.drb{flex:1;background:rgba(0,0,0,.45)}
@keyframes drin{from{transform:translateX(-100%)}to{transform:none}}

.drh{padding:0 20px 14px;text-align:center}.drh b{display:block;font-size:22px;letter-spacing:.02em}.drh span{color:var(--drmu);font-size:14px}

.dri .ic{width:26px;text-align:center;flex:none}.dri .bg{margin-left:auto;display:flex;gap:6px}

.drsep{border-top:2px solid var(--drmu);opacity:.4;margin:10px 22px}
.drf{padding:8px 22px;color:var(--drmu);font-size:14px}

main{padding:12px 16px 40px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.so{cursor:pointer}.so b{font-size:18px}.mu{color:var(--mu);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--ln)}
.tag.open{color:var(--act)}.tag.working{color:#1c7ed6}.tag.done{color:var(--ok)}
.ck{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--ln);font-size:16px;font-weight:400;color:var(--tx)}.ck input{width:22px;height:22px;margin:0;flex:none}.ck.dn span{text-decoration:line-through;color:var(--mu)}

.sub{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px}

.sub button.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}.sub.sm button.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 12px}
.wk button{padding:6px 0;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;min-width:0}
.wk button b{font-size:17px}.wk button.td{border:2px solid var(--ac)}.wk button.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}.wk button.on .mu{color:var(--on-ac)}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}

.row>*{min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{border-radius:12px;padding:10px 12px;border:1px solid var(--ln);background:var(--card)}.tile b{display:block;font-size:20px}.tile span{font-size:12px;color:var(--mu)}
.trow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer;font-size:15px}

.pill.auth{background:#f08c00;border-color:#f08c00;color:#1a1a1a}
.pill.repair{background:#7048e8;border-color:#7048e8;color:#fff}

.st i{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--ln);background:var(--card);font-style:normal;font-size:14px}
.st.ok i{background:var(--ok);border-color:var(--ok);color:#fff}.st.cur i{border-color:var(--ac);box-shadow:0 0 0 3px rgba(245,183,0,.4)}.st.cur{color:var(--tx);font-weight:700}
.trk{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mu);margin-top:10px}
.box2{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;margin:10px 0;color:var(--tx)}
.mirow{display:flex;align-items:center;gap:10px;margin-top:10px}.mirow input{margin:0;flex:1}
.ml{cursor:pointer;text-decoration:underline}
.card.run{border:3px solid var(--ok);box-shadow:0 0 0 4px rgba(43,138,62,.18)}
.runb{background:var(--ok);color:#fff;font-weight:700;font-size:13px;border-radius:8px;padding:4px 10px;margin:-4px 0 8px;display:inline-block}
@media print{header,nav,.btn,.seg,.sub,#mbw{display:none!important}body{background:#fff}.card{border:0}}
.tag.billed{background:var(--ok);border-color:var(--ok);color:#fff}.tag.tobill{color:var(--act);border-color:var(--act)}
.pt{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--tx);color:var(--bg);margin-left:4px;vertical-align:2px}
.prt{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer}
.prt:first-of-type{border-top:0}.prt.me{font-weight:700}.prt>span:first-child{flex:1}
input,textarea,select{width:100%;padding:11px;margin:4px 0 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;font-weight:600;color:var(--mu)}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--on-ac);font:inherit;font-weight:700;margin-top:6px}
.btn[style*="--ok"],.btn[style*="#e03131"]{color:#fff}

.row{display:flex;gap:8px}.row>*{flex:1}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.ph div{position:relative}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}

.hide{display:none}

.card.on{background:#2b8a3e;border-color:#2b8a3e;color:#fff}.card.on .mu{color:#e6f4ea}

<script>
var db=null,assets=null,dict=null,orders=[],tab=1,cur=null,local=[];
var tcAll=[],day=null,uid='local',nm=lg('wm_name')||'';
var Q='wm_queue',LS='wm_local',MAXP=3,splitting=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lg(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function queue(){return lg(Q)||[]}

// ---- website mode: Supabase database, logins and photos (inside Claude this stays off) ----
var SB=window.WAYMORE_SB||null,sbc=null,ME=null,ROLE=null,WORKERS=[],loginMode='wait',LMSG='',PENDING=null;
var DB={cache:{},ready:{},subs:[]},PEND='wm_pend';
function isMech(){return !!SB&&ROLE==='mechanic'}
function cacheSave(col){try{localStorage.setItem('wm_c_'+col,JSON.stringify(DB.cache[col]||{}))}catch(e){}}
function pend(){return lg(PEND)||[]}
function applyPend(col){pend().forEach(function(p){if(p.col!==col)return;if(p.data===null)delete DB.cache[col][p.id];else DB.cache[col][p.id]=p.data})}
function dbNotify(col){DB.subs.slice().forEach(function(s){if(s.col===col)s.fire()})}
function dbLoad(col){
  if(DB.ready[col])return DB.ready[col];
  if(!DB.cache[col]){DB.cache[col]=lg('wm_c_'+col)||{};applyPend(col)}
  DB.ready[col]=sbc.from('docs').select('id,data').eq('col',col).then(function(r){
    if(r.error)throw r.error;var m={};(r.data||[]).forEach(function(x){m[x.id]=x.data});DB.cache[col]=m;applyPend(col);cacheSave(col);dbNotify(col);
  }).catch(function(){delete DB.ready[col]});
  return DB.ready[col];
}
function dbReloadAll(){Object.keys(DB.cache).forEach(function(c){delete DB.ready[c];dbLoad(c)})}
function copyOf(d){return d==null?d:JSON.parse(JSON.stringify(d))}
function dbList(q){
  var m=DB.cache[q.col]||{},L=Object.keys(m).map(function(id){return {id:id,data:function(){return copyOf(m[id])}}});
  if(q.ord){var f=q.ord[0],dn=q.ord[1]=='desc';L.sort(function(a,b){var x=(m[a.id]||{})[f],y=(m[b.id]||{})[f];if(x==y)return 0;return ((x>y)?1:-1)*(dn?-1:1)})}
  return q.lim?L.slice(0,q.lim):L;
}
function dbWrite(col,id,data){
  if(!DB.cache[col])DB.cache[col]={};
  if(data===null)delete DB.cache[col][id];else DB.cache[col][id]=copyOf(data);
  cacheSave(col);
  var P=pend().filter(function(p){return !(p.col===col&&p.id===id)});P.push({col:col,id:id,data:data===null?null:DB.cache[col][id],s:Date.now()+Math.random()});sv(PEND,P);
  dbNotify(col);setTimeout(dbFlush,0);setNet();return Promise.resolve();
}
var flushing=false;
async function dbFlush(){
  if(flushing||!sbc||!ME)return;flushing=true;
  try{
    while(true){
      var P=pend();if(!P.length)break;var p=P[0],r;
      r=p.data===null?await sbc.from('docs').delete().eq('col',p.col).eq('id',p.id):await sbc.from('docs').upsert({col:p.col,id:p.id,data:p.data},{onConflict:'col,id'});
      if(r.error&&!r.error.code)break;
      sv(PEND,pend().filter(function(x){return x.s!==p.s}));
      if(r.error){toast(r.error.message||'Could not save',true);delete DB.ready[p.col];dbLoad(p.col)}
    }
  }catch(e){}
  flushing=false;setNet();
}
function dbLive(){
  sbc.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(ev){
    var r=ev.eventType==='DELETE'?ev.old:ev.new;if(!r||!r.col||!DB.cache[r.col])return;
    if(pend().some(function(p){return p.col===r.col&&p.id===r.id}))return;
    if(ev.eventType==='DELETE')delete DB.cache[r.col][r.id];else DB.cache[r.col][r.id]=r.data;
    cacheSave(r.col);dbNotify(r.col);
  }).subscribe(function(st){if(st==='SUBSCRIBED'){if(dbLive.was)dbReloadAll();dbLive.was=1}});
}
function dbDoc(col,id){
  var snap=function(){var d=(DB.cache[col]||{})[id];return {exists:!!d,data:function(){return copyOf(d)}}};
  return {
    set:function(d){return dbWrite(col,id,d)},
    update:function(p){return dbWrite(col,id,Object.assign({},(DB.cache[col]||{})[id]||{},p))},
    delete:function(){return dbWrite(col,id,null)},
    get:function(){return dbLoad(col).then(snap)},
    onSnapshot:function(cb){var s={col:col,fire:function(){cb(snap())}};DB.subs.push(s);dbLoad(col);s.fire();return function(){var i=DB.subs.indexOf(s);if(i>=0)DB.subs.splice(i,1)}}
  };
}
var SBDB={
  collection:function(col){var q={col:col,ord:null,lim:null};
    q.orderBy=function(f,d){q.ord=[f,d];return q};q.limit=function(n){q.lim=n;return q};q.doc=function(id){return dbDoc(col,id)};
    q.onSnapshot=function(cb){var s={col:col,fire:function(){cb({docs:dbList(q)})}};DB.subs.push(s);dbLoad(col);s.fire();return function(){}};return q},
  doc:function(path){var p=path.split('/');return dbDoc(p[0],p[1])}
};
var SBASSETS={upload:async function(blob){
  var path=(ME?ME.id:'x')+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.jpg';
  var r=await sbc.storage.from('photos').upload(path,blob,{contentType:blob.type||'image/jpeg'});if(r.error)throw r.error;
  return {id:path,url:sbc.storage.from('photos').getPublicUrl(path).data.publicUrl};
}};
function webDict(){
  var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;var fin=null,rec=null;
  return {onFinal:function(cb){fin=cb},stop:function(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()},
    start:function(){return new Promise(function(res,rej){try{rec=new R();rec.lang=lang=='es'?'es-MX':'en-US';rec.interimResults=false;
      rec.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal&&fin)fin({text:e.results[i][0].transcript})};rec.start();res()}catch(x){rej(x)}})}};
}
function roleName(r){return {pending:'Waiting for approval',mechanic:'Mechanic',desk:'Shop desk',admin:'Admin'}[r]||r}
function loadWorkers(){if(!sbc||!ME)return Promise.resolve();return sbc.from('profiles').select('*').order('created_at').then(function(r){if(!r.error){var c=JSON.stringify(r.data||[])!==JSON.stringify(WORKERS);WORKERS=r.data||[];if(c)render()}})}
function pendingN(){return SB&&ROLE==='admin'?WORKERS.filter(function(w){return w.role==='pending'}).length:0}
function pendingBanner(){var n=pendingN();return n?'<div class="box2" style="margin-top:0;border:2px solid var(--ac);cursor:pointer" onclick="go(\'settings\')"><b>👷 '+n+' new worker'+(n>1?'s':'')+' waiting for approval</b><div class="mu">Tap to approve ›</div></div>':''}
function lgo(m,msg){loginMode=m;LMSG=msg||'';render()}
function loginHtml(){

// photos: shrink to ~200-400 KB, queue, upload when signal returns
function shrink(file){return new Promise(function(res,rej){
  var im=new Image(),u=URL.createObjectURL(file);
  im.onload=function(){var m=1600,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.7))};
  im.onerror=rej;im.src=u})}
async function addPhotos(id,files){
  var q=queue();
  for(var i=0;i<files.length;i++){try{q.push({so:id,data:await shrink(files[i]),t:Date.now()})}catch(e){}}
  if(!sv(Q,q)){alert('Phone storage is full for waiting photos. Connect to upload first.')}
  setNet();render();sync();
}
var syncing=false;
async function sync(){
  if(syncing||!navigator.onLine||!assets||!db)return;syncing=true;
  try{
    var q=queue();
    while(q.length){
      var p=q[0],blob=await (await fetch(p.data)).blob();
      var r=await assets.upload(blob);
      var snap=await db.collection('serviceOrders').doc(p.so).get(),d=snap.data()||{},ph=(d.photos||[]).slice();
      ph.push(p.from?{url:r.url,t:p.t,from:p.from}:{url:r.url,t:p.t});await db.collection('serviceOrders').doc(p.so).update({photos:ph});
      q=queue().slice(1);sv(Q,q);setNet();
    }
  }catch(e){}
  syncing=false;setNet();render();
}

function trS(s){if(lang!='es')return s;if(Object.prototype.hasOwnProperty.call(ES,s))return ES[s];for(var i=0;i<PAT.length;i++){var m=s.match(PAT[i][0]);if(m)return typeof PAT[i][1]=='function'?PAT[i][1].apply(null,m):s.replace(PAT[i][0],PAT[i][1])}return s}
function tr(root){
  if(lang!='es'||!root)return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n,list=[];while(n=w.nextNode())list.push(n);
  list.forEach(function(n){var p=n.parentNode;if(!p||(p.closest&&p.closest('textarea,script,style,.raw')))return;var t=n.nodeValue,s=t.trim();if(!s)return;var r=trS(s);if(r!==s)n.nodeValue=t.replace(s,r)});
  if(root.querySelectorAll)root.querySelectorAll('[placeholder]').forEach(function(e){var r=trS(e.placeholder);if(r!==e.placeholder)e.placeholder=r});
}

  '<div>'+esc(o.customer)+' · '+esc(o.unit)+(o.mileage?' · '+esc(o.mileage)+' mi':'')+'</div><div class="mu">'+esc(o.mechanic||'Unassigned')+' · '+(o.photos||[]).length+' photos · '+fmt(soMs(o))+'</div>'+(acts(o).length?'<div class="mu">🔧 '+acts(o).filter(function(a){return a.st=='done'}).length+' of '+acts(o).length+' action items repaired</div>':'')+schedLine(o)+'</div>';
}
function listView(){
  var op=all().filter(function(o){return o.status!='done'}),td=today();
  var mine=function(o){return !nm||!o.mechanic||lc(o.mechanic)===lc(nm)};
  var t=op.filter(function(o){return o.schedDate===td&&mine(o)}).sort(bySched);
  var rest=op.filter(function(o){return t.indexOf(o)<0}).sort(bySched);
  var fin=all().filter(function(o){return o.status=='done'&&!o.billed&&mine(o)}).sort(function(a,b){return (b.created||0)-(a.created||0)});
  return clockCard()+'<h3 style="margin:8px 0">📅 Today\'s schedule</h3>'+(t.map(card).join('')||'<p class="mu">Nothing scheduled for you today.</p>')+
    '<h3 style="margin:16px 0 8px">All open jobs</h3>'+(rest.map(card).join('')||'<p class="mu">Nothing else open. New SOs from the desk show up here right away.</p>')+
    (fin.length?'<h3 style="margin:16px 0 8px">✅ Finished – waiting to be invoiced</h3>'+fin.map(card).join(''):'');
}
function billBox(o){
  if(tab!=1)return '';
  var n='SO '+esc(sonum(o));
  if(o.billed)return '<div class="card" style="margin-top:12px"><b>Billing</b> <span class="tag billed">BILLED</span><div class="mu">'+n+' billed on '+new Date(o.billedAt).toLocaleDateString(LOC())+(o.billedWith&&o.billedWith.length>1?'<br>Billed together: SO '+esc(o.billedWith.join(' + ')):'')+'</div>'+hoursTable([o])+partsSum([o])+estSum([o])+'<button class="btn alt" onclick="bill(\''+o.id+'\',false)">'+(o.billedWith&&o.billedWith.length>1?'Undo billing for all '+o.billedWith.length+' parts':'Undo billed')+'</button></div>';
  return '<div class="card" style="margin-top:12px"><b>Billing</b><div class="mu">'+(o.status=='done'?n+' is done and ready to bill.':n+' is not marked done yet.')+'</div>'+hoursTable([o])+partsSum([o])+estSum([o])+'<button class="btn" style="background:var(--ok)" onclick="bill(\''+o.id+'\',true)">💲 Mark '+n+' billed</button></div>';
}
function bill(id,v){
  var o=byId(id);if(!o)return;
  if(v){o.billed=true;o.billedAt=Date.now();delete o.billedWith;saveOrder(o).then(render);return}
  var g=o.billedWith?parts(o).filter(function(p){return p.billed&&p.billedAt===o.billedAt}):[o];
  g.reduce(function(pr,p){var c=p.id===o.id?o:p;delete c.billed;delete c.billedAt;delete c.billedWith;return pr.then(function(){return saveOrder(c)})},Promise.resolve()).then(render);
}
function billAllBtn(ps){
  if(tab!=1)return '';
  var un=ps.filter(function(p){return !p.billed});
  if(un.length<2)return un.length?'':'<div class="mu" style="margin-top:6px">All parts billed.</div>';
  var nd=un.filter(function(p){return p.status!='done'}).length;
  return '<div style="margin-top:10px"><b>Hours to bill together</b>'+hoursTable(un)+partsSum(un)+estSum(un)+'</div><button class="btn" style="background:var(--ok);margin-top:10px" onclick="billAll(\''+un[0].id+'\')">💲 Bill together: SO '+esc(un.map(sonum).join(' + '))+'</button>'+
    (nd?'<div class="mu">'+nd+' of these '+(nd>1?'are':'is')+' not marked done yet.</div>':'')+
    '<div class="mu">Or open a part to bill it separately.</div>';
}
function billAll(id){
  var o=byId(id);if(!o)return;
  var un=parts(o).filter(function(p){return !p.billed}),t=Date.now(),names=un.map(sonum);
  un.reduce(function(pr,p){var c=JSON.parse(JSON.stringify(p));c.billed=true;c.billedAt=t;c.billedWith=names;return pr.then(function(){return saveOrder(c)})},Promise.resolve()).then(render);
}
// hours worked on SOs, by day and mechanic, from the job timers
function ymd(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dlabel(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(LOC(),{weekday:'short',month:'short',day:'numeric'})}
function hoursTable(list){
  var m={},tot=0;
  list.forEach(function(p){(p.sessions||[]).forEach(function(s){var k=ymd(s.start)+'|'+(s.who||'?')+'|'+sonum(p),ms=(s.end||Date.now())-s.start;m[k]=(m[k]||0)+ms;tot+=ms})});
  var ks=Object.keys(m).sort();
  if(!ks.length)return '<div class="mu" style="margin:6px 0">No work time recorded on the timer yet.</div>';
  return '<div class="hrs">'+ks.map(function(k){var a=k.split('|');return '<div class="row mu"><span>'+dlabel(a[0])+'</span><span>'+esc(a[1])+(list.length>1?' · '+esc(a[2]):'')+'</span><span>'+fmt(m[k])+'</span></div>'}).join('')+
    '<div class="row"><b>Total to bill</b><span></span><b style="text-align:right">'+fmt(tot)+'</b></div></div>';
}
function onSOs(name,date){var t=0;all().forEach(function(o){(o.sessions||[]).forEach(function(s){if((s.who||'')===name&&ymd(s.start)===date)t+=(s.end||Date.now())-s.start})});return t}
function gapHtml(d){var j=onSOs(d.name,d.date),g=dayMs(d)-j;return '<br>on SOs '+fmt(j)+(g>15*60000?'<br><b style="color:#e03131">'+fmt(g)+' not on an SO</b>':'')}

var missFor=null,missRev=false,keepV=null;
var KEEPRE=/^(dt_|nt$|ac_(c|ca|co|m|iv)_)/,skipKeep=false;
function grabVals(){var k={};document.querySelectorAll('#app input,#app textarea,#app select').forEach(function(e){if(e.id&&KEEPRE.test(e.id)&&e.type!='file'&&e.type!='checkbox')k[e.id]=e.value});return k}
document.addEventListener('change',function(e){
  if(!missFor||!e.target||!KEEPRE.test(e.target.id||'')||missFor!==cur)return;
  var w=$('mbw'),o=byId(cur);if(!w||!o)return;
  keepV=grabVals();keepV.id=cur;
  w.innerHTML=missBox(o,true);tr(w);
});
function ownPhotos(o){return (o.photos||[]).filter(function(p){return !p.from}).length+queue().filter(function(p){return p.so===o.id&&!p.from}).length}
function photoHead(o){var n=ownPhotos(o),r=NP();return n>=r?'Photos ✓ '+n:'Photos ('+n+' of '+r+' required)'}
function missing(o,skipItems){
  var m=[],ph=ownPhotos(o),un=(o.items||[]).filter(function(x){return !x.done}).length,A=o.actions||[];
  if(!lc(o.customer))m.push('Customer');if(!lc(o.unit))m.push('Truck / unit');if(!lc(o.mileage))m.push('Mileage');
  if(!lc(o.desc)&&!A.some(function(a){return lc(a.c)}))m.push('Complaint / description');if(!lc(o.mechanic))m.push('Mechanic');
  if(!skipItems){A.forEach(function(a,i){var n='Action '+(i+1)+': ';if(!lc(a.c))m.push(n+'complaint');if(!lc(a.cause)&&!a.noDiag)m.push(n+'cause');if(!lc(a.corr))m.push(n+'correction');if(a.st!='done')m.push(n+'not marked repaired')});
    if(un)m.push('Checklist: '+un+' item'+(un>1?'s':'')+' not checked')}
  if(ph<NP())m.push('Photos: '+ph+' of '+NP()+' taken');
  return m;
}
function missTab(s){return /^(Customer|Truck|Complaint)/.test(s)?'edit':'act'}
function missBox(o){
  if(missFor!==o.id)return '';var oo=o;
  if(keepV&&keepV.id===o.id){oo=JSON.parse(JSON.stringify(o));applyVals(oo,function(k){return k in keepV?keepV[k]:null})}
  var mm=missing(oo,missRev);
  if(!mm.length)return '<div class="card" style="border:2px solid var(--ok)"><b style="color:var(--ok)">✓ Everything is filled out. You can finish now.</b></div>';
  return '<div class="card" id="missbox" style="border:2px solid #e03131"><b style="color:#e03131">Can\'t finish yet. Please complete:</b>'+mm.map(function(x){var t=missTab(x);return '<div'+(t!=jt?' class="ml" onclick="setJt(\''+t+'\')"':'')+'>• '+esc(x)+'</div>'}).join('')+'</div>';
}
function applyVals(o,get){
  [['dt_cu','customer'],['dt_un','unit'],['dt_mi','mileage'],['dt_de','desc'],['dt_vin','vin'],['dt_pl','plate'],['dt_ps','plateState'],['dt_rq','contact'],['dt_loc','location'],['dt_back','backBy'],['dt_po','po'],['dt_dn','deskNotes']].forEach(function(p){var x=get(p[0]);if(x!=null)o[p[1]]=/^(vin|plate|plateState)$/.test(p[1])?x.trim().toUpperCase():x.trim()});
  var pa=get('dt_pam');if(pa!=null)o.preAmt=parseFloat(pa)||0;
  var r=get('dt_rt');if(r!=null){o.rate=parseFloat(r)||0;if(o.rate)sv('wm_rate',o.rate)}
  (o.actions||[]).forEach(function(a,i){var x;if((x=get('ac_c_'+i))!=null)a.c=x.trim();if((x=get('ac_ca_'+i))!=null)a.cause=x.trim();if((x=get('ac_co_'+i))!=null)a.corr=x.trim();if((x=get('ac_m_'+i))!=null)a.mech=x.trim();if((x=get('ac_iv_'+i))!=null)a.inv=parseFloat(x)||0});
  return o;
}
function readDetails(o){
  var c=$('dtc');if(!o||!c||c.dataset.id!==o.id)return o;
  return applyVals(o,function(k){var e=$(k);return e?e.value:null});
}

function soInfo(o){
  var L=[];if(o.contact)L.push('Requested by: '+esc(o.contact));if(o.po)L.push('PO #: '+esc(o.po));if(o.location)L.push('📍 '+esc(o.location));
  if(o.availAt)L.push((o.mustAccess?'⚠️ Must access at: ':'Available: ')+esc(new Date(o.availAt).toLocaleString(LOC(),{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})));
  if(o.backBy)L.push('Wanted back: '+esc(o.backBy));if(+o.preAmt>0&&SP())L.push('Pre-authorized up to '+money(o.preAmt));

function setSkip(id,v){var o=readDetails(byId(id));if(!o)return;o.skipDiag=v;acts(o).forEach(function(a){if(v&&a.st=='diag'){a.st='repair';a.noDiag=true}else if(!v&&a.noDiag&&a.st=='repair'&&!lc(a.cause)){a.st='diag';delete a.noDiag}});saveOrder(o).then(render)}
function setPA(id,v){var o=readDetails(byId(id));if(!o)return;o.preAuth=v;if(v)acts(o).forEach(function(a){if(a.st=='auth'){a.st='repair';a.authAt=Date.now();a.authBy='pre'}});saveOrder(o).then(render)}
function saveDetails(id){blurA();var o=readDetails(byId(id));if(o)saveOrder(o).then(render)}

// ---- scheduling ----
var sd=today();
function addDays(s,n){var p=s.split('-');return ymd(new Date(+p[0],+p[1]-1,+p[2]+n).getTime())}
function weekOf(s){var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d.getTime())}
function t12(hm){var p=String(hm).split(':');return new Date(2000,0,1,+p[0],+p[1]).toLocaleTimeString(LOC(),{hour:'numeric',minute:'2-digit'})}
function bySched(a,b){var x=(a.schedDate||'9')+(a.schedTime||'99'),y=(b.schedDate||'9')+(b.schedTime||'99');return x<y?-1:x>y?1:0}
function schedLine(o){return o.schedDate?'<div class="mu">📅 '+(o.schedDate===today()?'Today':dlabel(o.schedDate))+(o.schedTime?' · '+t12(o.schedTime):'')+(o.estH?' · est '+o.estH+'h':'')+'</div>':''}
function mechNames(){var s={};(cfg.mechs||[]).forEach(function(n){s[n]=1});all().forEach(function(o){if(o.mechanic)s[o.mechanic]=1});tcAll.forEach(function(d){if(d.name)s[d.name]=1});return Object.keys(s).sort()}
function mechList(v){var L=(cfg.mechs||[]).slice();WORKERS.forEach(function(w){if(w.role=='mechanic'&&w.name&&L.indexOf(w.name)<0)L.push(w.name)});if(!L.length)L=mechNames();if(v&&L.indexOf(v)<0)L.push(v);return L}
function mechSel(id,v){
  var L=mechList(v);
  if(!L.length)return '<input id="'+id+'" autocomplete="off" placeholder="Name" value="'+esc(v)+'"><div class="mu" style="margin:-6px 0 8px">Save your mechanics in ⚙️ Settings to pick them from a list.</div>';
  return '<select id="'+id+'"><option value="">Choose mechanic</option>'+L.map(function(n){return '<option value="'+esc(n)+'"'+(n===v?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>';
}
function mechDatalist(){return '<datalist id="mel">'+mechNames().map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist>'}
function schedCard(o){
  if(tab!=1)return '';
  return '<div class="card"><b>📅 Schedule</b>'+
    '<div class="row"><span><label>Date</label><input id="sc_dt" type="date" value="'+esc(o.schedDate)+'"></span><span><label>Time</label><input id="sc_tm" type="time" value="'+esc(o.schedTime)+'"></span></div>'+
    '<div class="row"><span style="flex:.6"><label>Est. hours</label><input id="sc_h" inputmode="decimal" value="'+(o.estH||'')+'"></span><span><label>Mechanic</label>'+mechSel('sc_m',o.mechanic)+'</span></div>'+mechDatalist()+

function saveSched(id,clear){
  blurA();var o=byId(id);if(!o)return;
  if(clear){o.schedDate='';o.schedTime='';o.estH=0}
  else{var d=$('sc_dt').value;if(!d){$('sc_dt').focus();$('sc_dt').style.borderColor='#e03131';return}o.schedDate=d;o.schedTime=$('sc_tm').value||'';o.estH=parseFloat($('sc_h').value)||0;o.mechanic=$('sc_m').value.trim();sd=d}
  saveOrder(o).then(render);
}
function schedView(){
  var a=all(),ws=weekOf(sd),td=today(),days=[0,1,2,3,4,5,6].map(function(i){return addDays(ws,i)});
  var strip='<div class="wk">'+days.map(function(d){var n=a.filter(function(o){return o.schedDate===d}).length,p=d.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);
    return '<button class="'+(d===sd?'on':'')+(d===td?' td':'')+'" onclick="sd=\''+d+'\';render()"><span>'+dt.toLocaleDateString(LOC(),{weekday:'short'})+'</span><b>'+dt.getDate()+'</b><span class="mu">'+(n?n+' job'+(n>1?'s':''):' ')+'</span></button>'}).join('')+'</div>';
  var nav='<div class="row" style="align-items:center"><button class="btn alt" style="flex:0 0 auto;width:auto;margin:0;padding:10px 14px" onclick="sd=addDays(sd,-7);render()">‹</button>'+
    '<input id="sc_d" type="date" value="'+sd+'" style="margin:0" onchange="if(this.value){sd=this.value};blurA();render()">'+
    '<button class="btn alt" style="flex:0 0 auto;width:auto;margin:0;padding:10px 14px" onclick="sd=addDays(sd,7);render()">›</button>'+
    '<button class="btn alt" style="flex:0 0 auto;width:auto;margin:0;padding:10px 12px" onclick="sd=today();render()">Today</button></div>';
  var jobs=a.filter(function(o){return o.schedDate===sd}).sort(bySched),g={};
  jobs.forEach(function(o){var k=o.mechanic||'Unassigned';(g[k]=g[k]||[]).push(o)});
  var day='<h3 style="margin:4px 0">'+(sd===td?'Today · ':'')+dlabel(sd)+'</h3>'+(jobs.length?Object.keys(g).sort().map(function(k){
    var h=g[k].reduce(function(s,o){return s+(+o.estH||0)},0);
    return '<div class="mh"><b>👤 '+esc(k)+'</b><span class="mu"'+(h>8?' style="color:#e03131;font-weight:700"':'')+'>'+g[k].length+' job'+(g[k].length>1?'s':'')+(h?' · '+h+'h booked'+(h>8?' (over 8h)':''):'')+'</span></div>'+g[k].map(card).join('')}).join(''):'<p class="mu">Nothing scheduled this day.</p>');
  var un=a.filter(function(o){return o.status!='done'&&!o.schedDate});
  return nav+strip+day+'<h3 style="margin:20px 0 4px">Not scheduled yet ('+un.length+')</h3><p class="mu" style="margin:0 0 8px">Open a ticket to give it a date, time and mechanic.</p>'+(un.map(card).join('')||'<p class="mu">Every open ticket is scheduled.</p>');
}

var GEO={watch:null,last:null,sent:null,trail:null,trailSent:0,err:null,needIn:false,denied:false};
var GMAP={map:null,el:null,marks:{},line:null,lib:null,list:[],fit:true};
function clockedIn(){var l=day&&day.punches&&day.punches[day.punches.length-1];return !!(l&&!l.out)}
function dist(a,b){var R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r,x=Math.pow(Math.sin(dl/2),2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.pow(Math.sin(dg/2),2);return 2*R*Math.asin(Math.sqrt(x))}
function geoStart(){
  if(!SB||!ME||GEO.watch!=null)return;
  if(!navigator.geolocation){GEO.err='unavailable';geoReport();geoChip();return}
  try{GEO.watch=navigator.geolocation.watchPosition(geoPos,geoErr,{enableHighAccuracy:true,maximumAge:20000,timeout:60000})}catch(e){GEO.err='unavailable';geoReport()}
  geoChip();
}
function geoStop(){
  if(GEO.watch!=null){try{navigator.geolocation.clearWatch(GEO.watch)}catch(e){}}GEO.watch=null;
  if(GEO.trail&&GEO.trail.pts.length)dbWrite('loctrail',GEO.trail.id,{uid:ME.id,name:nm,date:today(),pts:GEO.trail.pts});GEO.trail=null;GEO.trailSent=0;
  var c=GEO.last||{};if(ME)dbWrite('locations',ME.id,{uid:ME.id,name:nm,lat:c.lat==null?null:c.lat,lng:c.lng==null?null:c.lng,acc:c.acc||null,at:c.at||Date.now(),clockedIn:false,outAt:Date.now()});
  GEO.sent=null;GEO.err=null;geoChip();
}
function geoPos(p){
  var c={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0),at:Date.now()},hadErr=GEO.err;GEO.last=c;GEO.err=null;GEO.denied=false;
  if(GEO.needIn&&day&&day.punches&&day.punches.length){var d=JSON.parse(JSON.stringify(day)),l=d.punches[d.punches.length-1];if(l&&!l.out&&!l.inLoc){l.inLoc=[c.lat,c.lng];day=d;db.doc('timeclock/'+dayKey()).set(d)}GEO.needIn=false}
  if(!clockedIn())return;
  if(hadErr||!GEO.sent||c.at-GEO.sent.at>60000||dist(GEO.sent,c)>100){GEO.sent=c;dbWrite('locations',ME.id,{uid:ME.id,name:nm,lat:c.lat,lng:c.lng,acc:c.acc,at:c.at,clockedIn:true});geoTrail(c)}
  geoChip();if(hadErr)render();
}
function geoErr(e){
  GEO.err=e&&e.code==1?'denied':'unavailable';
  if(e&&e.code==1){GEO.denied=true;if(GEO.watch!=null){try{navigator.geolocation.clearWatch(GEO.watch)}catch(x){}GEO.watch=null}}
  geoReport();geoChip();render();
}
function geoReport(){if(!ME||!clockedIn())return;var c=GEO.last||{};dbWrite('locations',ME.id,{uid:ME.id,name:nm,lat:c.lat==null?null:c.lat,lng:c.lng==null?null:c.lng,acc:c.acc||null,at:c.at||null,clockedIn:true,off:GEO.err,offAt:Date.now()})}
async function geoTrail(c){
  var id='trail_'+ME.id+'_'+today();
  if(!GEO.trail||GEO.trail.id!==id){GEO.trail={id:id,pts:[]};try{var r=await sbc.from('docs').select('data').eq('col','loctrail').eq('id',id).maybeSingle();if(r.data&&r.data.data&&r.data.data.pts)GEO.trail.pts=r.data.data.pts.concat(GEO.trail.pts)}catch(e){}}
  GEO.trail.pts.push([c.at,+c.lat.toFixed(6),+c.lng.toFixed(6)]);if(GEO.trail.pts.length>3000)GEO.trail.pts=GEO.trail.pts.slice(-3000);
  if(c.at-GEO.trailSent>300000||GEO.trail.pts.length<3){GEO.trailSent=c.at;dbWrite('loctrail',id,{uid:ME.id,name:nm,date:today(),pts:GEO.trail.pts})}
}
function geoPunch(d,dir){
  if(dir=='in'){GEO.needIn=true;GEO.denied=false;GEO.err=null;geoStart()}
  else{var lp=d.punches[d.punches.length-1];if(lp&&GEO.last&&Date.now()-GEO.last.at<600000)lp.outLoc=[GEO.last.lat,GEO.last.lng];setTimeout(geoStop,0)}
}
function geoSync(){if(!SB||!ME)return;var on=clockedIn();if(on&&GEO.watch==null&&!GEO.denied&&!GEO.err)geoStart();else if(!on&&GEO.watch!=null)geoStop();geoChip()}

  GMAP.lib=new Promise(function(res,rej){var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(l);

function mapMarks(){
  if(!GMAP.map)return;var seen={},pts=[];
  GMAP.list.forEach(function(x){if(x.lat==null||!x.clockedIn)return;seen[x.uid]=1;var ll=[x.lat,x.lng];pts.push(ll);
    var ic=L.divIcon({className:'',iconSize:null,html:'<span class="lpin'+(x.off?' off':'')+'">'+esc((x.name||'?').split(' ')[0])+'</span>'});
    if(GMAP.marks[x.uid])GMAP.marks[x.uid].setLatLng(ll).setIcon(ic);else GMAP.marks[x.uid]=L.marker(ll,{icon:ic}).addTo(GMAP.map);
    GMAP.marks[x.uid].bindPopup(esc(x.name||'')+'<br>'+ago(x.at))});
  Object.keys(GMAP.marks).forEach(function(k){if(!seen[k]){GMAP.map.removeLayer(GMAP.marks[k]);delete GMAP.marks[k]}});
  if(GMAP.fit&&pts.length){GMAP.map.fitBounds(pts,{padding:[40,40],maxZoom:15});GMAP.fit=false}

function runPlate(pre){

async function nhtsa(v){
  var c=new AbortController(),t=setTimeout(function(){c.abort()},8000);
  try{var r=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+v+'?format=json',{signal:c.signal});var j=await r.json(),x=j&&j.Results&&j.Results[0];
    if(!x||!x.Make)return null;return {year:x.ModelYear||'',make:cap(x.Make),model:x.Model||'',src:'NHTSA'}}catch(e){return null}finally{clearTimeout(t)}
}
async function claudeVin(v){
  try{var s=window.claude&&await claude.use('sample');if(!s)return null;
    var d=await s.json('Decode this 17-character vehicle VIN: '+v+'. Use the World Manufacturer Identifier (first 3 characters), the vehicle descriptor section (characters 4-8) and the model-year character (10th). Answer ONLY JSON: {"year":"","make":"","model":""}. Use common names, e.g. make Ford, Freightliner, International, Peterbilt, Kenworth, Mack, Volvo, Chevrolet, Ram, Isuzu, Hino and model F-550, Cascadia, 4300. Leave model empty if you are not sure.',{modelTier:'default'});
    if(d&&d.make)return {year:String(d.year||''),make:d.make,model:d.model||'',src:'Claude'}}catch(e){}
  return null;
}
async function runVin(pre){
  var e=vf(pre,'vi');if(!e)return;var v=e.value.trim().toUpperCase().replace(/\s/g,'');e.value=v;
  if(v.length!=17||/[^A-HJ-NPR-Z0-9]/.test(v)){vst(pre,'A VIN has 17 letters and numbers (no I, O or Q).',true);return}
  if(e.dataset.done===v)return;e.dataset.done=v;
  var warn=!vinCheck(v);vst(pre,'Looking up VIN…');
  var r=await nhtsa(v)||await claudeVin(v);
  if(!r){e.dataset.done='';vst(pre,'Could not look up this VIN right now. Type the year, make and model.',true);return}
  var ymm=[r.year,r.make,r.model].filter(Boolean).join(' '),u=vf(pre,'un');
  if(u){var old=u.value.trim();u.value=!old||/^\d{4} /.test(old)?ymm:ymm+' · '+old}
  vst(pre,'✓ '+ymm+(r.src=='Claude'?' (read by Claude, please double-check)':'')+(warn?' · VIN check digit does not match, double-check the VIN':''),warn);
}
async function scanVin(pre,file){
  if(!file)return;var s=null;try{s=window.claude&&await claude.use('sample')}catch(e){}
  if(!s){vst(pre,'Scanning needs Claude, which is not available here.',true);return}
  vst(pre,'Reading the photo…');
  try{
    var blob=await (await fetch(await shrink(file))).blob();
    var d=await s.json('This photo shows a vehicle VIN plate, door-jamb sticker, registration card, title or windshield VIN. Read the 17-character VIN exactly (VINs never contain I, O or Q). If a license plate number and its state are visible, read them too. Answer ONLY JSON: {"vin":"","plate":"","state":""}. Use empty strings for anything you cannot read clearly.',{images:[blob],modelTier:'default',cache:false});
    var vin=String(d&&d.vin||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(d&&d.plate&&!vf(pre,'pl').value)vf(pre,'pl').value=String(d.plate).toUpperCase();
    if(d&&d.state&&!vf(pre,'ps').value)vf(pre,'ps').value=String(d.state).toUpperCase().slice(0,2);
    if(vin.length!=17){vst(pre,'Could not read a VIN in the photo. Try again closer, or type it.',true);return}
    vf(pre,'vi').value=vin;runVin(pre);
  }catch(e){vst(pre,e&&e.code=='not_granted'?'Claude was not allowed, so the photo could not be read.':'Could not read a VIN in the photo. Try again closer, or type it.',true)}
}

function noteText(n){return (lang=='es'?(n.es||n.t):(n.t||n.es))||n.t||''}
function notesCard(o){
  var L=noteEntries(o).slice().sort(function(a,b){return (b.at||0)-(a.at||0)});
  return '<div class="card"><b>Work log</b>'+
    (L.map(function(n){return '<div class="note"><div class="raw" style="white-space:pre-wrap">'+esc(noteText(n))+'</div><div class="mu">'+noteStamp(n)+(n.es&&n.t&&n.es!==n.t?' · <span class="raw">'+(lang=='es'?'guardada en inglés':'auto-translated')+'</span>':'')+'</div></div>'}).join('')||'<div class="mu" style="margin:6px 0">No notes yet.</div>')+
    '<label style="display:block;margin-top:10px">Add a note</label><textarea id="nt" rows="3" placeholder="Type a note and tap Add"></textarea>'+
    '<div class="row">'+(dict?'<button class="btn alt" id="mic" onclick="mic()">🎤 Dictate</button>':'')+'<button class="btn" id="addnote" onclick="addNote(\''+o.id+'\')">Add note</button></div></div>';
}
// translate: Claude artifact uses the Claude model; the website uses a free translation service.
async function autoTr(text,from,to){
  try{if(!SB&&window.claude&&claude.use){var s=await claude.use('sample');if(s){var r=await s('Translate this auto repair shop work note from '+(from=='es'?'Spanish':'English')+' to '+(to=='es'?'Spanish':'English')+'. Keep part numbers and names. Reply with ONLY the translation, no quotes:\n\n'+text,{modelTier:'quick'});if(r&&r.text)return r.text.trim()}}}catch(e){}
  try{var u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'%7C'+to+'&de=waymore.jobs@gmail.com';var rr=await fetch(u);var j=await rr.json();var t=j&&j.responseData&&j.responseData.translatedText;if(t&&!/MYMEMORY WARNING|QUOTA EXCEEDED|INVALID/i.test(t))return t}catch(e){}
  return null;
}
var adding=false;
async function addNote(id){
  if(adding)return;var e=$('nt'),v=e?e.value.trim():'';if(!v){if(e)e.focus();return}
  if(SB&&!nm&&ME)nm=ME.name;
  var o=byId(id);if(!o)return;blurA();adding=true;
  var btn=$('addnote');if(btn){btn.disabled=true;btn.textContent=lang=='es'?'Guardando…':'Saving…';tr(btn)}
  var note={by:nm||'',at:Date.now()};
  if(lang=='es'){var en=await autoTr(v,'es','en');note.t=en||v;note.es=v}
  else{note.t=v;var es=await autoTr(v,'en','es');if(es)note.es=es}
  o.noteLog=(o.noteLog||[]).concat([note]);if(e){e.value='';e.disabled=false}
  adding=false;
  saveOrder(o).then(render);toast('✓ Note added');
}
function setSt(id,s){var o=byId(id);if(!o)return;o.status=s;saveOrder(o).then(function(){if(s=='done')cur=null;render()})}
// time tracking
function fmt(ms){var m=Math.floor((ms||0)/60000);return Math.floor(m/60)+'h '+('0'+m%60).slice(-2)+'m'}
function tm(t){return new Date(t).toLocaleTimeString(LOC(),{hour:'numeric',minute:'2-digit'})}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dayKey(){return 'tc_'+uid+'_'+today()}
function dayMs(d){return d&&d.punches?d.punches.reduce(function(a,p){return a+((p.out||Date.now())-p['in'])},0):0}
function soMs(o){return (o.sessions||[]).reduce(function(a,s){return a+((s.end||Date.now())-s.start)},0)}
function running(o){var l=(o.sessions||[])[(o.sessions||[]).length-1];return !!(l&&!l.end)}
function stopMyTimers(){
  // When a mechanic clocks out, stop any job timer still running on their tickets
  // so hours don't keep counting after they've left for the day.
  all().forEach(function(o){
    var ss=o.sessions||[],l=ss[ss.length-1];
    if(!l||l.end)return;
    if(l.who&&nm&&l.who!==nm)return;            // leave other mechanics' timers alone
    var x=readDetails(byId(o.id));if(!x)return;
    x.sessions=(x.sessions||[]).slice();var ll=x.sessions[x.sessions.length-1];
    if(ll&&!ll.end){ll.end=Date.now();saveOrder(x);}
  });
}
function loadDay(){if(db&&uid!='local'){db.doc('timeclock/'+dayKey()).onSnapshot(function(s){day=s.exists?s.data():null;render()},function(){})}else{day=lg('wm_day_'+today())}}
function needName(){if(!nm){var e=$('nmi'),v=e?e.value.trim():'';if(v){nm=v;sv('wm_name',nm)}else if(e){e.focus();e.style.borderColor='#e03131'}}return nm}
function nameBox(){return nm?'':'<label>Your name (first time only)</label><input id="nmi" placeholder="Type your name, then tap the button">'}
function clock(dir){
  if(!needName())return;
  try{
  var d=day?JSON.parse(JSON.stringify(day)):{name:nm,date:today(),uid:uid,punches:[]};d.name=nm;d.punches=d.punches||[];
  var l=d.punches[d.punches.length-1];
  if(dir=='in'){if(l&&!l.out)return;d.punches.push({'in':Date.now()})}else{if(!l||l.out){$('net').textContent='Not clocked in';return}d.punches[d.punches.length-1]={'in':l['in'],out:Date.now()}}
  day=d;if(SB)geoPunch(d,dir);sbPush('timeclock',dayKey(),d);
  if(db&&uid!='local')db.doc('timeclock/'+dayKey()).set(d).catch(function(e){$('net').textContent='Clock not saved: '+((e&&(e.code||e.message))||'try again')});else sv('wm_day_'+today(),d);
  if(dir=='out')stopMyTimers();
  render();
  }catch(e){$('net').textContent='Clock error: '+e.message}
}
function clockCard(){
  var l=day&&day.punches&&day.punches[day.punches.length-1],on=l&&!l.out;
  return '<div class="card'+(on?' on':'')+'"><b>'+(on?'CLOCKED IN':'Today\'s hours')+'</b><div style="font-size:28px;font-weight:700" id="dtick">'+fmt(dayMs(day))+'</div><div class="mu">'+(on?'Clocked in since '+tm(l['in']):(l?'Clocked out at '+tm(l.out):'Not clocked in'))+'</div>'+
  geoNote(on)+nameBox()+(on?'<button class="btn" onclick="clock(\'out\')">Clock out</button>':'<button class="btn" onclick="clock(\'in\')">Clock in</button>')+'</div>';
}
function weekStart(){var d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function hhmm(t){var d=new Date(t);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function atTime(date,s){var m=/^(\d{1,2}):(\d{2})$/.exec((s||'').trim());if(!m)return null;var p=date.split('-');return new Date(+p[0],+p[1]-1,+p[2],+m[1],+m[2]).getTime()}
function deskClock(){
  if(!db)return '';
  var ws=weekStart(),wk={},rows=[];
  tcAll.forEach(function(d){if(d.date>=ws){var k=d.name||'?';wk[k]=(wk[k]||0)+dayMs(d);rows.push(d)}});
  var tot=Object.keys(wk).sort().map(function(k){return '<div class="row" style="margin:4px 0"><span>'+esc(k)+'</span><span class="mu" style="text-align:right">'+fmt(wk[k])+'</span></div>'}).join('');
  var sh=rows.map(function(d){var p=d.punches||[],l=p[p.length-1],on=l&&!l.out;
    return '<div class="row" style="margin:6px 0;align-items:center"><span>'+esc(d.name)+'<br><span class="mu">'+esc(d.date)+'</span></span><span class="mu" style="text-align:right">'+(on?'IN · ':'')+fmt(dayMs(d))+gapHtml(d)+'</span><button class="btn alt" style="margin:0;padding:6px" onclick="fixDay(\''+d._id+'\')">Edit</button></div>'}).join('');
  return edBox()+'<div class="card"><b>Hours this week</b>'+(tot||'<div class="mu">No hours yet this week.</div>')+'</div>'+
    '<div class="card"><b>Time sheet (tap Edit to fix a punch)</b>'+(sh||'<div class="mu">No punches yet.</div>')+'</div>';
}
var ed=null;
function fixDay(id){ed=id;render()}
function cancelEd(){ed=null;render()}
function saveEd(){blurA();
  var d=tcAll.find(function(x){return x._id==ed});if(!d){ed=null;return}
  var ps=[];
  for(var i=0;i<(d.punches||[]).length;i++){
    var a=$('ei'+i).value,b=$('eo'+i).value,ti=atTime(d.date,a),to=atTime(d.date,b);
    if(ti==null||(b&&to==null)||(to&&to<ti)){$('net').textContent='Fix times: out must be after in';return}
    ps.push(to?{'in':ti,out:to}:{'in':ti});
  }
  sbPush('timeclock',ed,{name:d.name,date:d.date,uid:d.uid||'',punches:ps});
  db.doc('timeclock/'+ed).set({name:d.name,date:d.date,uid:d.uid||'',punches:ps}).then(function(){ed=null;render()}).catch(function(){$('net').textContent='Could not save'});
}
function edBox(){var d=ed&&tcAll.find(function(x){return x._id==ed});if(!d)return '';
  return '<div class="card"><b>Edit '+esc(d.name)+' · '+esc(d.date)+'</b>'+(d.punches||[]).map(function(p,i){return '<label>In</label><input type="time" id="ei'+i+'" value="'+hhmm(p['in'])+'"><label>Out (blank if still working)</label><input type="time" id="eo'+i+'" value="'+(p.out?hhmm(p.out):'')+'">'}).join('')+'<div class="row"><button class="btn alt" onclick="cancelEd()">Cancel</button><button class="btn" onclick="saveEd()">Save</button></div></div>'}
function timer(id,act,aid){
  var o=readDetails(byId(id));if(!o)return;if(act=='start'&&!needName())return;
  if(act=='done'){if(!o.mechanic&&nm)o.mechanic=nm;var mm=missing(o);if(mm.length){missFor=id;missRev=false;saveOrder(o).then(function(){render();var b=$('missbox');if(b)b.scrollIntoView({block:'center'})});return}}
  o.sessions=(o.sessions||[]).slice();var l=o.sessions[o.sessions.length-1];
  if(act=='start'){
    var want=aid||firstOpen(o)||null;
    if(l&&!l.end){if((l.a||null)===want)return;l.end=Date.now()}
    var s={who:nm,start:Date.now()};if(want)s.a=want;o.sessions.push(s);o.status='working';if(!o.mechanic)o.mechanic=nm;
    var A=acts(o).find(function(x){return x.id===want});if(A&&!A.mech)A.mech=nm;
  }
  else{if(l&&!l.end)l.end=Date.now();if(act=='done')o.status='done'}
  if(act=='done')missFor=null;
  saveOrder(o).then(function(){if(act=='done')cur=null;render()});
}
setInterval(function(){var a=$('dtick');if(a)a.textContent=fmt(dayMs(day));var t=$('tick'),o=cur&&byId(cur);if(t&&o)t.textContent=fmt(soMs(o))},30000);
function mic(tid){
  if(!dict)return;micT=tid||'nt';
  if(!micReg){micReg=true;dict.onFinal(function(r){var t=$(micT);if(t)t.value=(t.value+' '+r.text).trim()})}
  dict.start().catch(function(){});
}
$('t1').onclick=function(){commit();setOpen=false;tab=1;cur=null;splitting=null;render()};
$('t2').onclick=function(){commit();setOpen=false;tab=2;cur=null;splitting=null;render()};
if(SB)boot();else init();
</script></body></html>
